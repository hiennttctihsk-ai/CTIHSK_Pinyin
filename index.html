<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng pinyin tương tác - CTIHSK Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#328043; --blue:#2566a3;
  --bg:#ffffff; --ink:#22342a; --ink-2:#647568; --grid:#d9e4db;
  --hd:#328043; --hd-ink:#ffffff; --sel:#2566a3; --sel-ink:#ffffff;
  --tint:#e9f3eb; --empty:#f4f7f4; --card:#ffffff; --shadow:rgba(20,50,30,.24);
  --dim:#a6b5a9; --accent:#328043;
  --gline:#7fae8a; --pinyin:"Andika","Montserrat","Segoe UI","Noto Sans",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a13; --ink:#e2eee5; --ink-2:#93a89a; --grid:#263a2c;
    --hd:#2a6b39; --hd-ink:#f2fbf4; --sel:#3d83c6; --sel-ink:#ffffff;
    --tint:#172b1e; --empty:#142118; --card:#182a1e; --shadow:rgba(0,0,0,.6);
    --dim:#5a6f5f; --accent:#6cc084; --gline:#4d7a5a;
  }
}
:root[data-theme="dark"]{
  --bg:#101a13; --ink:#e2eee5; --ink-2:#93a89a; --grid:#263a2c;
  --hd:#2a6b39; --hd-ink:#f2fbf4; --sel:#3d83c6; --sel-ink:#ffffff;
  --tint:#172b1e; --empty:#142118; --card:#182a1e; --shadow:rgba(0,0,0,.6);
  --dim:#5a6f5f; --accent:#6cc084; --gline:#4d7a5a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Montserrat","Segoe UI","Noto Sans",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;
}
header{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:8px 18px;background:#ffffff;color:#22342a;border-bottom:3px solid var(--green);
}
.logo{height:52px;width:auto;display:block}
.head-text{flex:1 1 260px;min-width:0}
h1{font-size:19px;font-weight:700;margin:0;color:#328043}
.hint{font-size:12.5px;color:#5b6d60;margin:2px 0 0;line-height:1.45}
.voice{font-size:11.5px;color:#5b6d60}
.zoom{display:flex;align-items:center;gap:4px}
.zoom button{all:unset;box-sizing:border-box;cursor:pointer;height:34px;min-width:34px;padding:0 8px;display:grid;place-items:center;
  border:1px solid #c5d6c9;border-radius:8px;background:#f5faf6;color:#22342a;font:600 15px/1 "Montserrat","Segoe UI",system-ui,sans-serif}
.zoom button:hover{border-color:#328043;background:#e9f3eb}
.zoom button:focus-visible{outline:2px solid #2566a3;outline-offset:2px}
.zoom button[disabled]{opacity:.4;cursor:default}
.zoom #zVal{min-width:58px;font-size:13px}
.voice.warn{color:#b3541e}
.wrap{flex:1;min-height:0;overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;font-family:var(--pinyin);font-size:calc(16px*var(--z,1));min-width:max-content}
th,td{padding:0;text-align:center;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap}
thead th{position:sticky;top:0;z-index:3;background:var(--hd);color:var(--hd-ink);font-weight:600;height:2.3em;min-width:3.6em;
  border-right-color:rgba(255,255,255,.3)}
tbody th{position:sticky;left:0;z-index:2;background:var(--hd);color:var(--hd-ink);font-weight:600;min-width:4.2em;
  border-bottom-color:rgba(255,255,255,.3)}
thead th:first-child{left:0;z-index:4}
th button{all:unset;display:block;width:100%;height:100%;min-height:34px;line-height:34px;cursor:pointer;padding:0 10px;box-sizing:border-box}
th button:hover{background:rgba(255,255,255,.18)}
th button:focus-visible{outline:2px solid #fff;outline-offset:-3px}
th.say{background:var(--sel)!important}
td{height:2.2em;min-width:3.6em}
td.empty{background:var(--empty)}
td.gr,tbody th.gr{border-top:2px solid var(--gline)}
th.gc,td.gc{border-left:2px solid var(--gline)}
td button{all:unset;display:block;width:100%;height:100%;line-height:2.2em;cursor:pointer;padding:0 .4em;font-variant-ligatures:none}
td button:hover{background:var(--tint)}
td button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td.on button,td.on button:hover{background:var(--sel);color:var(--sel-ink);font-weight:600}
th.on{background:var(--sel)!important;color:var(--sel-ink)!important}
td.rowon:not(.on) button,td.colon:not(.on) button{background:var(--tint)}

.pop{
  position:fixed;z-index:20;font-family:var(--pinyin);font-size:calc(16px*var(--z,1));width:min(23em,calc(100vw - 20px));background:var(--card);color:var(--ink);
  border:1px solid var(--grid);border-radius:12px;box-shadow:0 10px 30px var(--shadow);padding:14px 16px 16px;
}
.pop[hidden]{display:none}
.pop-top{display:flex;align-items:baseline;gap:12px}
.pop-syl{font-size:1.6em;font-weight:700}
.pop-split{font-size:1.1em;font-weight:600;color:var(--ink-2)}
.pop-x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:20px;line-height:1;color:var(--ink-2);margin-left:auto}
.pop-x:hover{background:var(--tint);color:var(--ink)}
.pop-x:focus-visible,.tone:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tone{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--grid);border-radius:10px;padding:12px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tone:hover{border-color:var(--accent);background:var(--tint)}
.tone.playing{border-color:var(--sel);background:var(--tint)}
.tone-py{font-size:1.25em;font-weight:700}
.tone svg{width:1.4em;height:1.4em;color:var(--accent)}
footer{padding:6px 16px;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--grid)}
@media (max-width:520px){
  .logo{height:40px} h1{font-size:16px} table{font-size:calc(14px*var(--z,1))}
  .pop{left:10px!important;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto!important;width:auto}
}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .12s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>

const srcs = name => {
  const list = SRC.map(s => s.base + encodeURIComponent(s.uu ? name.replace(/ü/g,"uu") : name) + ".mp3");
  if (EMBED[name]) return [EMBED[name], ...list];
  return USE_YOYO.has(name) ? [YOYO + name + ".mp3", ...list] : list;
};

const TONE_MARKS = {a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
const PLAY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>';


function mark(syl, t){
  let idx = syl.indexOf("a");
  if (idx < 0) idx = syl.indexOf("e");
  if (idx < 0 && syl.includes("ou")) idx = syl.indexOf("o");
  if (idx < 0){ for (let i = syl.length-1; i >= 0; i--) if ("aeiouü".includes(syl[i])){ idx = i; break; } }
  if (idx < 0) return syl;
  return syl.slice(0,idx) + TONE_MARKS[syl[idx]][t-1] + syl.slice(idx+1);
}
const keyOf = (syl,t) => syl.replace(/ü/g,"v") + t;
const toneText = (syl,t) => { const k = keyOf(syl,t); return DATA.chars[k] || DATA.alt[k] || mark(syl,t); };

/* ---------- Table ---------- */
const tbl = document.getElementById("tbl");
const rowInits = DATA.rowInits, colDefs = DATA.cols;
const ROW_GROUP = new Set(["b","d","g","z","zh","j"]);   /* đầu mỗi nhóm thanh mẫu */
let html = "<thead><tr><th scope='col' aria-label='Thanh mẫu (hàng) và vần (cột)'></th>";
colDefs.forEach((c,ci) => {
  html += `<th scope="col" class="${c.gc ? "gc" : ""}" data-c="${ci}"${c.tip ? ` title="${c.tip}"` : ""}>${c.label}</th>`;
});
html += "</tr></thead><tbody>";
rowInits.forEach((ini,ri) => {
  const gr = ROW_GROUP.has(ini) ? "gr" : "";
  html += `<tr data-r="${ri}"><th scope="row" class="${gr}" data-r="${ri}"${ini === "" ? ' title="Không có thanh mẫu"' : ""}>${ini}</th>`;
  colDefs.forEach((c,ci) => {
    const syl = c.cells[ini];
    const cls = [gr, c.gc ? "gc" : "", syl ? "" : "empty"].filter(Boolean).join(" ");
    html += syl
      ? `<td class="${cls}" data-r="${ri}" data-c="${ci}"><button type="button" data-syl="${syl}">${syl}</button></td>`
      : `<td class="${cls}" data-r="${ri}" data-c="${ci}"></td>`;
  });
  html += "</tr>";
});
html += "</tbody>";
tbl.innerHTML = html;

/* ---------- Phóng to / thu nhỏ ---------- */
const Z_MIN = 0.7, Z_MAX = 2, Z_STEP = 0.1;
let zoom = 1;
try { const s = parseFloat(localStorage.getItem("pinyinZoom")); if (s >= Z_MIN && s <= Z_MAX) zoom = s; } catch (e) {}
function setZoom(v){
  zoom = Math.round(Math.min(Z_MAX, Math.max(Z_MIN, v)) * 10) / 10;
  document.documentElement.style.setProperty("--z", zoom);
  document.getElementById("zVal").textContent = Math.round(zoom * 100) + "%";
  document.getElementById("zOut").disabled = zoom <= Z_MIN;
  document.getElementById("zIn").disabled = zoom >= Z_MAX;
  try { localStorage.setItem("pinyinZoom", String(zoom)); } catch (e) {}
  if (typeof pop !== "undefined" && !pop.hidden && activeTd) requestAnimationFrame(() => place(activeTd));
}
document.getElementById("zOut").addEventListener("click", () => setZoom(zoom - Z_STEP));
document.getElementById("zIn").addEventListener("click", () => setZoom(zoom + Z_STEP));
document.getElementById("zVal").addEventListener("click", () => setZoom(1));

/* ---------- Voice ---------- */
let zhVoice = null;
const voiceBox = document.getElementById("voice");
function pickVoice(){
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang) || /chinese|中文|普通话/i.test(v.name));
  return vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs[0] || null;
}
function refreshVoice(){
  zhVoice = pickVoice();
  if (SRC.length){ voiceBox.textContent = ""; return; }
  if (!("speechSynthesis" in window)){
    voiceBox.className = "voice warn"; voiceBox.textContent = "Trình duyệt này không hỗ trợ phát giọng đọc.";
  } else if (!zhVoice){
    voiceBox.className = "voice warn"; voiceBox.textContent = "Chưa có giọng tiếng Trung trên thiết bị này.";
  } else {
    voiceBox.className = "voice"; voiceBox.textContent = "Giọng đọc: " + zhVoice.name;
  }
}
if ("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = refreshVoice; }
refreshVoice();

/* ---------- Phát âm: file mp3 nếu có, không thì giọng trình duyệt ---------- */
let curAudio = null, curMark = null;
function stopAll(){
  if (curAudio){ curAudio.pause(); curAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (curMark){ curMark.classList.remove("playing","say"); curMark = null; }
}
function speakText(text, markEl){
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = zhVoice ? zhVoice.lang : "zh-CN";
  if (zhVoice) u.voice = zhVoice;
  u.rate = 0.6;
  const done = () => { if (curMark === markEl) stopMark(); };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function stopMark(){ if (curMark){ curMark.classList.remove("playing","say"); curMark = null; } }
function play(urls, text, markEl, cls){
  stopAll();
  curMark = markEl; markEl.classList.add(cls);
  let i = 0;
  const next = () => {
    if (curMark !== markEl) return;
    if (i >= urls.length){ curAudio = null; speakText(text, markEl); return; }
    const a = new Audio(urls[i++]);
    curAudio = a;
    a.onended = () => { if (curMark === markEl) stopMark(); };
    a.onerror = () => { if (curAudio === a) next(); };
    a.play().catch(() => { if (curAudio === a) next(); });
  };
  next();
}

/* ---------- Popup ---------- */
const pop = document.getElementById("pop");
const pSyl = document.getElementById("pSyl"), pSplit = document.getElementById("pSplit"), pTones = document.getElementById("pTones");
let activeTd = null;

function clearOn(){ document.querySelectorAll(".on,.rowon,.colon").forEach(e => e.classList.remove("on","rowon","colon")); }
function closePop(){
  pop.hidden = true; clearOn(); stopAll();
  if (activeTd){ const b = activeTd.querySelector("button"); activeTd = null; if (b) b.focus({preventScroll:true}); }
}
function openPop(td){
  const ri = +td.dataset.r, ci = +td.dataset.c;
  const syl = td.querySelector("button").dataset.syl;
  const ini = rowInits[ri], fin = colDefs[ci].final;
  activeTd = td; clearOn();
  td.classList.add("on");
  tbl.querySelector(`thead th[data-c="${ci}"]`).classList.add("on");
  tbl.querySelector(`tbody th[data-r="${ri}"]`).classList.add("on");
  tbl.querySelectorAll(`td[data-r="${ri}"]`).forEach(e => e.classList.add("rowon"));
  tbl.querySelectorAll(`td[data-c="${ci}"]`).forEach(e => e.classList.add("colon"));
  td.classList.remove("rowon","colon");

  pSyl.textContent = syl;
  pSplit.textContent = ini ? `${ini} + ${fin}` : fin;
  pTones.innerHTML = "";
  for (let t = 1; t <= 4; t++){
    const b = document.createElement("button");
    b.type = "button"; b.className = "tone";
    b.setAttribute("aria-label", `Phát ${mark(syl,t)}`);
    b.innerHTML = `<span class="tone-py">${mark(syl,t)}</span>${PLAY_SVG}`;
    b.addEventListener("click", () => play(srcs(syl + t), toneText(syl,t), b, "playing"));
    pTones.appendChild(b);
  }
  pop.hidden = false;
  place(td);
}
function place(td){
  if (window.innerWidth <= 520) return;
  const r = td.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight, m = 10;
  let x = r.left + r.width/2 - w/2;
  let y = r.bottom + 8;
  if (y + h > window.innerHeight - m) y = r.top - h - 8;
  x = Math.max(m, Math.min(x, window.innerWidth - w - m));
  y = Math.max(m, y);
  pop.style.left = x + "px"; pop.style.top = y + "px";
}

tbl.addEventListener("click", e => {
  const b = e.target.closest("td button");
  if (!b) return;
  const td = b.parentElement;
  if (td === activeTd && !pop.hidden){ closePop(); return; }
  openPop(td);
});
document.getElementById("pClose").addEventListener("click", closePop);
setZoom(zoom);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) closePop(); });
document.addEventListener("pointerdown", e => {
  if (pop.hidden) return;
  if (pop.contains(e.target) || e.target.closest("td button")) return;
  closePop();
});
document.getElementById("wrap").addEventListener("scroll", () => { if (!pop.hidden && activeTd) place(activeTd); });
window.addEventListener("resize", () => { if (!pop.hidden && activeTd) place(activeTd); });
</script>
</body>
</html>
